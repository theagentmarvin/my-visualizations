<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BIM Mobile Viewer</title>
  <script type="module" crossorigin src="/my-visualizations/projects/bim-mobile-viewer/assets/index-DJCpNqJ0.js"></script>
  <link rel="modulepreload" crossorigin href="/my-visualizations/projects/bim-mobile-viewer/assets/three-B7amW-Id.js">
  <link rel="modulepreload" crossorigin href="/my-visualizations/projects/bim-mobile-viewer/assets/thatopen-BOVms0GZ.js">
  <link rel="stylesheet" crossorigin href="/my-visualizations/projects/bim-mobile-viewer/assets/index-CPtm3FDP.css">
</head>
<body>
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading" class="loading-overlay">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading BIM Model...</p>
    </div>

    <!-- 3D Viewer Section -->
    <div id="viewer-container" class="viewer-container">
      <canvas id="viewer-canvas"></canvas>
      
      <!-- Navigation Controls Panel -->
      <div class="nav-panel">
        <div class="panel-header">
          <span class="panel-title">Navigation</span>
        </div>
        <div class="nav-controls">
          <button id="btn-reset" class="nav-btn" title="Reset View">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
          </button>
          <button id="btn-zoom-in" class="nav-btn" title="Zoom In">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
          </button>
          <button id="btn-zoom-out" class="nav-btn" title="Zoom Out">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M19 13H5v-2h14v2z"/>
            </svg>
          </button>
        </div>
        <div class="view-controls">
          <button id="btn-top" class="view-btn" title="Top View">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-9h10v2H7z"/>
            </svg>
            <span>Top</span>
          </button>
          <button id="btn-front" class="view-btn" title="Front View">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
            </svg>
            <span>Front</span>
          </button>
          <button id="btn-iso" class="view-btn" title="Isometric View">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M12 2l-5.5 9h11z M12 5.84L13.93 9h-3.87z M17.5 13c-2.49 0-4.5 2.01-4.5 4.5s2.01 4.5 4.5 4.5 4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5z M5 21.5h8v-8H5v8z"/>
            </svg>
            <span>ISO</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Categories Panel Section -->
    <div id="categories-panel" class="categories-panel">
      <div class="panel-header">
        <div class="panel-title-row">
          <svg class="panel-icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/>
          </svg>
          <span class="panel-title">Element Categories</span>
        </div>
        <button id="btn-show-all" class="text-btn" title="Show All Elements">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
          Show All
        </button>
      </div>
      
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search categories..." class="search-input">
      </div>
      
      <div class="table-wrapper">
        <table id="category-table">
          <thead>
            <tr>
              <th>Category</th>
              <th>Count</th>
            </tr>
          </thead>
          <tbody id="category-tbody">
            <!-- Categories will be populated here -->
          </tbody>
        </table>
      </div>
      
      <div id="category-summary" class="category-summary"></div>
    </div>
  </div>

</body>
</html>
