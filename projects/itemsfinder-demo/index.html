<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItemsFinder Demo - That Open Engine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "@thatopen/components": "https://unpkg.com/@thatopen/components@2.4.4/dist/index.mjs",
      "@thatopen/fragments": "https://unpkg.com/@thatopen/fragments@2.1.6/dist/index.mjs",
      "@thatopen/ui": "https://unpkg.com/@thatopen/ui@2.4.4/dist/index.js",
      "stats.js": "https://unpkg.com/stats.js@0.17.0/build/stats.min.js"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #container { width: 100%; height: 100%; position: relative; }
    .stats-container { position: absolute; top: 0; left: 0; z-index: 10; }
    bim-panel { position: absolute; top: 1rem; right: 1rem; z-index: 100; max-width: 20rem; max-height: calc(100vh - 2rem); overflow-y: auto; }
    .phone-menu-toggler { position: absolute; bottom: 1rem; right: 1rem; z-index: 101; display: none; }
    @media (max-width: 768px) {
      bim-panel { position: fixed; top: auto; bottom: 0; left: 0; right: 0; max-width: 100%; max-height: 60vh; border-radius: 1rem 1rem 0 0; transform: translateY(100%); transition: transform 0.3s ease; }
      bim-panel.options-menu-visible { transform: translateY(0); }
      .phone-menu-toggler { display: block; }
      #diagnosticsPanel { max-height: 35vh !important; width: calc(100% - 2rem) !important; left: 1rem !important; }
    }
    .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(32, 41, 50, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; color: white; transition: opacity 0.5s ease; }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner { width: 48px; height: 48px; border: 4px solid rgba(255, 255, 255, 0.3); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 1rem; opacity: 0.8; }
    /* DIAGNOSTICS PANEL - ALWAYS VISIBLE */
    #diagnosticsPanel { position: fixed; bottom: 1rem; left: 1rem; z-index: 150; width: 480px; max-height: 320px; background: rgba(15, 23, 42, 0.93); border: 1px solid rgba(100, 116, 139, 0.4); border-radius: 10px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-size: 12px; display: flex; flex-direction: column; overflow: hidden; transition: all 0.3s ease; }
    #diagnosticsPanel.collapsed { max-height: 42px; }
    #diagnosticsPanel.error-state { border-color: rgba(239, 68, 68, 0.7); box-shadow: 0 12px 30px rgba(239, 68, 68, 0.25); }
    #diagnosticsPanel.success-state { border-color: rgba(34, 197, 94, 0.6); }
    #diagnosticsHeader { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: rgba(51, 65, 85, 0.85); border-bottom: 1px solid rgba(100, 116, 139, 0.3); cursor: pointer; user-select: none; transition: background 0.2s; }
    #diagnosticsPanel.error-state #diagnosticsHeader { background: rgba(185, 28, 28, 0.9); }
    #diagnosticsPanel.success-state #diagnosticsHeader { background: rgba(21, 128, 61, 0.85); }
    #diagnosticsHeader:hover { background: rgba(71, 85, 105, 0.95); }
    #diagnosticsPanel.error-state #diagnosticsHeader:hover { background: rgba(220, 38, 38, 0.95); }
    #diagnosticsTitle { font-weight: 600; color: #f1f5f9; display: flex; align-items: center; gap: 8px; font-size: 13px; }
    #diagnosticsStatus { font-size: 10px; padding: 3px 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); font-weight: 600; text-transform: uppercase; }
    #diagnosticsControls { display: flex; gap: 6px; }
    #diagnosticsControls button { background: rgba(255, 255, 255, 0.1); border: none; color: #cbd5e1; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 11px; font-family: inherit; transition: all 0.2s; }
    #diagnosticsControls button:hover { background: rgba(255, 255, 255, 0.25); color: #fff; }
    #diagnosticsContent { flex: 1; overflow-y: auto; padding: 10px 14px; color: #e2e8f0; line-height: 1.6; max-height: 270px; }
    #diagnosticsPanel.collapsed #diagnosticsContent { display: none; }
    .diag-entry { margin-bottom: 5px; padding: 3px 0; border-bottom: 1px solid rgba(100, 116, 139, 0.1); word-break: break-word; }
    .diag-entry:last-child { border-bottom: none; }
    .diag-time { color: #64748b; font-size: 10px; margin-right: 6px; }
    .diag-level-info { color: #94a3b8; }
    .diag-level-success { color: #4ade80; font-weight: 500; }
    .diag-level-warn { color: #fbbf24; }
    .diag-level-error { color: #f87171; font-weight: 600; }
    .diag-level-critical { color: #fff; background: rgba(239, 68, 68, 0.35); padding: 3px 6px; border-radius: 4px; display: inline-block; }
    .diag-prefix { color: #60a5fa; font-weight: 600; }
    #collapseIcon { transition: transform 0.3s; font-size: 10px; display: inline-block; }
    #diagnosticsPanel.collapsed #collapseIcon { transform: rotate(-90deg); }
    #errorOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 1000; display: none; flex-direction: column; padding: 2.5rem; overflow: auto; }
    #errorOverlay.visible { display: flex; }
    #errorOverlay h2 { color: #f87171; margin-bottom: 1.5rem; font-size: 1.75rem; display: flex; align-items: center; gap: 12px; }
    #errorContent { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(239, 68, 68, 0.5); border-radius: 10px; padding: 1.5rem; color: #e2e8f0; font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow: auto; max-height: 60vh; }
    #errorCloseBtn { margin-top: 1.5rem; padding: 12px 24px; background: rgba(239, 68, 68, 0.85); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; align-self: flex-start; transition: all 0.2s; }
    #errorCloseBtn:hover { background: rgba(239, 68, 68, 1); }
  </style>
</head>
<body>
  <div id="container"></div>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading BIM models...</div>
  </div>
  <div class="stats-container" id="statsContainer"></div>
  <div id="diagnosticsPanel">
    <div id="diagnosticsHeader">
      <div id="diagnosticsTitle">
        <span id="collapseIcon">▼</span>
        <span>🔧 Diagnostics</span>
        <span id="diagnosticsStatus">INIT</span>
      </div>
      <div id="diagnosticsControls">
        <button id="btnClear">Clear</button>
        <button id="btnCollapse">−</button>
      </div>
    </div>
    <div id="diagnosticsContent"></div>
  </div>
  <div id="errorOverlay">
    <h2>❌ Critical Error</h2>
    <div id="errorContent"></div>
    <button id="errorCloseBtn">Close & Show Diagnostics</button>
  </div>

  <!-- EARLY DEBUG SCRIPT - runs immediately after HTML parsing -->
  <script>
    (function() {
      const debugDiv = document.getElementById('diagnosticsContent');
      if (debugDiv) {
        debugDiv.innerHTML = '<div class="diag-entry"><span class="diag-time">' + new Date().toLocaleTimeString() + '</span><span class="diag-level-success">JS1</span> <span class="diag-prefix">[EARLY]</span> HTML parsed OK</div>';
      }
      console.log('JS1 loaded - HTML parsed OK');
    })();
  </script>

  <script type="module">
    // === FIRST LINE: Setup appendLog function ===
    const debugDiv = document.getElementById('diagnosticsContent');
    const appendLog = (msg) => {
      if (!debugDiv) {
        console.log('[EARLY LOG] ' + msg);
        return;
      }
      const entry = document.createElement('div');
      entry.className = 'diag-entry';
      entry.innerHTML = '<span class="diag-time">' + new Date().toLocaleTimeString() + '</span><span class="diag-level-info">INFO</span> <span class="diag-prefix">[EARLY]</span> ' + msg;
      debugDiv.appendChild(entry);
      debugDiv.scrollTop = debugDiv.scrollHeight;
    };
    appendLog('JS2: Module script started');

    // === GLOBAL ERROR HANDLER ===
    window.addEventListener('error', (e) => {
      appendLog('GLOBAL ERROR: ' + e.message + ' at ' + (e.filename || '?') + ':' + (e.lineno || '?'));
      console.error('Global error:', e);
    });
    window.addEventListener('unhandledrejection', (e) => {
      appendLog('UNHANDLED PROMISE: ' + (e.reason?.message || e.reason || 'Unknown'));
      console.error('Unhandled rejection:', e);
    });
    appendLog('Global error handlers registered');

    const Diagnostics = {
      logEntries: [], content: document.getElementById('diagnosticsContent'), panel: document.getElementById('diagnosticsPanel'),
      status: document.getElementById('diagnosticsStatus'), errorOverlay: document.getElementById('errorOverlay'),
      errorContent: document.getElementById('errorContent'), hasError: false, isCollapsed: false,
      init() {
        document.getElementById('diagnosticsHeader').addEventListener('click', (e) => { if (!e.target.closest('#diagnosticsControls')) this.toggle(); });
        document.getElementById('btnClear').addEventListener('click', () => this.clear());
        document.getElementById('btnCollapse').addEventListener('click', () => this.toggle());
        document.getElementById('errorCloseBtn').addEventListener('click', () => this.hideErrorOverlay());
        this.interceptConsole(); this.setupErrorHandlers(); this.info('Diagnostics initialized', 'SYSTEM');
      },
      interceptConsole() {
        const orig = { log: console.log, info: console.info, warn: console.warn, error: console.error };
        console.log = (...a) => { this.addEntry('info', a.join(' ')); orig.log.apply(console, a); };
        console.info = (...a) => { this.addEntry('info', a.join(' ')); orig.info.apply(console, a); };
        console.warn = (...a) => { this.addEntry('warn', a.join(' ')); orig.warn.apply(console, a); };
        console.error = (...a) => { const m = a.join(' '); this.addEntry('error', m); this.setErrorState(); orig.error.apply(console, a); };
      },
      setupErrorHandlers() {
        // Note: window error handlers already set up above in early script
      },
      addEntry(level, message, prefix = '') {
        const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
        const entry = { time, level, message, prefix }; this.logEntries.push(entry); if (this.logEntries.length > 150) this.logEntries.shift(); this.renderEntry(entry);
      },
      renderEntry(entry) {
        const div = document.createElement('div'); div.className = 'diag-entry';
        const prefixHtml = entry.prefix ? '<span class="diag-prefix">[' + entry.prefix + ']</span> ' : '';
        div.innerHTML = '<span class="diag-time">' + entry.time + '</span><span class="diag-level-' + entry.level + '">' + entry.level.toUpperCase() + '</span> ' + prefixHtml + this.escapeHtml(entry.message);
        this.content.appendChild(div); this.content.scrollTop = this.content.scrollHeight;
      },
      escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; },
      setErrorState() { this.hasError = true; this.panel.classList.add('error-state'); this.panel.classList.remove('success-state'); this.status.textContent = 'ERROR'; this.status.style.background = 'rgba(239, 68, 68, 0.6)'; this.panel.classList.remove('collapsed'); document.getElementById('btnCollapse').textContent = '−'; this.isCollapsed = false; },
      setSuccessState() { if (!this.hasError) { this.panel.classList.add('success-state'); this.status.textContent = 'READY'; this.status.style.background = 'rgba(34, 197, 94, 0.5)'; } },
      info(m, p = '') { this.addEntry('info', m, p); }, success(m, p = '') { this.addEntry('success', m, p); if (!this.hasError) this.setSuccessState(); }, warn(m, p = '') { this.addEntry('warn', m, p); }, error(m, p = '') { this.addEntry('error', m, p); this.setErrorState(); }, critical(m, p = '') { this.addEntry('critical', m, p); this.setErrorState(); },
      toggle() { this.panel.classList.toggle('collapsed'); this.isCollapsed = !this.isCollapsed; document.getElementById('btnCollapse').textContent = this.isCollapsed ? '+' : '−'; },
      clear() { this.logEntries = []; this.content.innerHTML = ''; },
      showErrorOverlay(c) { this.errorContent.textContent = c; this.errorOverlay.classList.add('visible'); },
      hideErrorOverlay() { this.errorOverlay.classList.remove('visible'); this.panel.classList.remove('collapsed'); this.isCollapsed = false; document.getElementById('btnCollapse').textContent = '−'; }
    };
    Diagnostics.init();

    const urlParams = new URLSearchParams(window.location.search);
    const forceErrorMode = urlParams.get('forceError');
    if (forceErrorMode) Diagnostics.warn('Force error: ' + forceErrorMode, 'URL');

    try {
      Diagnostics.info('Starting ItemsFinder Demo...', 'APP');
      if (forceErrorMode === 'import') throw new Error('Forced import error');

      appendLog('About to import Three.js...');
      Diagnostics.info('Importing Three.js...', 'IMPORT');
      const THREE = await import('three');
      appendLog('Three.js imported OK');
      Diagnostics.success('Three.js loaded', 'IMPORT');

      appendLog('About to import That Open Components...');
      Diagnostics.info('Importing That Open Components...', 'IMPORT');
      const OBC = await import('@thatopen/components');
      appendLog('That Open Components imported OK');
      Diagnostics.success('OBC loaded', 'IMPORT');

      appendLog('About to import That Open UI...');
      Diagnostics.info('Importing That Open UI...', 'IMPORT');
      const BUI = await import('@thatopen/ui');
      appendLog('That Open UI imported OK');
      Diagnostics.success('UI loaded', 'IMPORT');

      appendLog('About to import Fragments...');
      Diagnostics.info('Importing Fragments...', 'IMPORT');
      const FRAGS = await import('@thatopen/fragments');
      appendLog('Fragments imported OK');
      Diagnostics.success('Fragments loaded', 'IMPORT');

      appendLog('About to import Stats.js...');
      Diagnostics.info('Importing Stats.js...', 'IMPORT');
      const Stats = (await import('stats.js')).default;
      appendLog('Stats.js imported OK');
      Diagnostics.success('Stats.js loaded', 'IMPORT');

      if (forceErrorMode === 'obc') { Diagnostics.error('Simulating OBC duplicate', 'FORCE'); throw new Error('OBC already declared'); }

      appendLog('Initializing BUI Manager...');
      Diagnostics.info('Initializing BUI Manager...', 'UI');
      BUI.Manager.init();
      appendLog('BUI Manager initialized OK');
      Diagnostics.success('BUI initialized', 'UI');

      const container = document.getElementById('container');
      appendLog('Creating Components...');
      Diagnostics.info('Creating Components...', 'OBC');
      if (forceErrorMode === 'components') throw new Error('Forced components error');
      const components = new OBC.Components();
      appendLog('Components created OK');
      Diagnostics.success('Components created', 'OBC');

      appendLog('Creating world...');
      Diagnostics.info('Creating world...', 'WORLD');
      const worlds = components.get(OBC.Worlds);
      const world = worlds.create();
      appendLog('World created OK');
      Diagnostics.success('World created', 'WORLD');

      appendLog('Setting up scene...');
      Diagnostics.info('Setting up scene...', 'SCENE');
      world.scene = new OBC.SimpleScene(components);
      world.scene.setup();
      world.scene.three.background = null;
      appendLog('Scene setup OK');
      Diagnostics.success('Scene ready', 'SCENE');

      appendLog('Setting up renderer...');
      Diagnostics.info('Setting up renderer...', 'RENDER');
      world.renderer = new OBC.SimpleRenderer(components, container);
      appendLog('Renderer setup OK');
      Diagnostics.success('Renderer ready', 'RENDER');

      appendLog('Setting up camera...');
      Diagnostics.info('Setting up camera...', 'CAMERA');
      world.camera = new OBC.OrthoPerspectiveCamera(components);
      await world.camera.controls.setLookAt(78, 20, -2.2, 26, -4, 25);
      appendLog('Camera positioned OK');
      Diagnostics.success('Camera positioned', 'CAMERA');

      appendLog('Initializing components...');
      Diagnostics.info('Initializing components...', 'OBC');
      components.init();
      appendLog('Components initialized OK');
      Diagnostics.success('Components initialized', 'OBC');

      appendLog('Setting up Stats.js...');
      Diagnostics.info('Setting up Stats.js...', 'PERF');
      const stats = new Stats();
      stats.showPanel(2);
      document.getElementById('statsContainer').appendChild(stats.dom);
      stats.dom.style.left = '0px';
      world.renderer.onBeforeUpdate.add(() => stats.begin());
      world.renderer.onAfterUpdate.add(() => stats.end());
      appendLog('Stats.js setup OK');
      Diagnostics.success('Stats ready', 'PERF');

      appendLog('Setting up FragmentsManager...');
      Diagnostics.info('Setting up FragmentsManager...', 'FRAGS');
      if (forceErrorMode === 'worker') throw new Error('Forced worker error');
      const workerUrl = 'https://thatopen.github.io/engine_fragment/resources/worker.mjs';

      appendLog('Fetching worker from: ' + workerUrl);
      Diagnostics.info('Fetching worker...', 'FRAGS');
      const fetched = await fetch(workerUrl);
      if (!fetched.ok) throw new Error('HTTP ' + fetched.status);
      appendLog('Worker fetch OK - status: ' + fetched.status);

      appendLog('Creating worker blob...');
      const blob = await fetched.blob();
      const url = URL.createObjectURL(new File([blob], 'worker.mjs', { type: 'text/javascript' }));
      appendLog('Worker blob created OK');
      Diagnostics.success('Worker blob OK', 'FRAGS');

      appendLog('Initializing FragmentsManager with worker...');
      const fragments = components.get(OBC.FragmentsManager);
      fragments.init(url);
      appendLog('FragmentsManager initialized OK');
      Diagnostics.success('FragmentsManager ready', 'FRAGS');

      world.camera.controls.addEventListener('update', () => fragments.core.update());
      world.onCameraChanged.add((cam) => { for (const [, m] of fragments.list) m.useCamera(cam.three); fragments.core.update(true); });
      fragments.list.onItemSet.add(({ value: m }) => { Diagnostics.success('Model: ' + (m.uuid?.slice(0,8) || 'unknown'), 'MODEL'); m.useCamera(world.camera.three); world.scene.three.add(m.object); fragments.core.update(true); });
      fragments.core.models.materials.list.onItemSet.add(({ value: mat }) => { if (!mat.isLodMaterial) { mat.polygonOffset = true; mat.polygonOffsetUnits = 1; mat.polygonOffsetFactor = Math.random(); } });
      Diagnostics.success('Fragment handlers attached', 'FRAGS');

      appendLog('Setting up ItemsFinder...');
      Diagnostics.info('Setting up ItemsFinder...', 'FINDER');
      const finder = components.get(OBC.ItemsFinder);
      finder.create('Walls & Slabs', [{ categories: [/WALL/, /SLAB/] }]);
      finder.create('Masonry Walls', [{ categories: [/WALL/], attributes: { queries: [{ name: /Name/, value: /Masonry/ }] } }]);
      finder.create('First Level Columns', [{ categories: [/COLUMN/], relation: { name: 'ContainedInStructure', query: { categories: [/BUILDINGSTOREY/], attributes: { queries: [{ name: /Name/, value: /Entry/ }] } } } }]);
      appendLog('ItemsFinder queries created OK');
      Diagnostics.success('ItemsFinder queries created', 'FINDER');

      const getResult = async (name) => { const q = finder.list.get(name); return q ? await q.test() : {}; };

      appendLog('Creating UI panel...');
      Diagnostics.info('Creating UI panel...', 'UI');
      const queriesList = BUI.Component.create(() => {
        const onCreated = (e) => { if (!e) return; const t = e; t.loadFunction = async () => { const d = []; for (const [n] of finder.list) d.push({ data: { Name: n, Actions: '' } }); return d; }; t.loadData(true); };
        return BUI.html\`<bim-table \${BUI.ref(onCreated)}></bim-table>\`;
      });
      queriesList.style.maxHeight = '25rem';
      queriesList.columns = ['Name', { name: 'Actions', width: 'auto' }];
      queriesList.noIndentation = true;
      queriesList.headersHidden = true;
      queriesList.dataTransform = {
        Actions: (_, row) => {
          const { Name } = row; if (!Name) return _;
          const onClick = async ({ target }) => { Diagnostics.info('Query: ' + Name, 'QUERY'); target.loading = true; try { const map = await getResult(Name); await components.get(OBC.Hider).isolate(map); Diagnostics.success('Query done: ' + Name, 'QUERY'); } catch (e) { Diagnostics.error('Query failed: ' + e.message, 'QUERY'); } target.loading = false; };
          return BUI.html\`<bim-button icon="solar:cursor-bold" @click=\${onClick}></bim-button>\`;
        }
      };

      const panel = BUI.Component.create(() => {
        const onReset = async ({ target }) => { Diagnostics.info('Resetting visibility...', 'HIDER'); target.loading = true; await components.get(OBC.Hider).set(true); target.loading = false; Diagnostics.success('Visibility reset', 'HIDER'); };
        return BUI.html\`<bim-panel active label="Items Finder Tutorial" class="options-menu"><bim-panel-section style="min-width:14rem" label="General"><bim-button label="Reset Visibility" @click=\${onReset}></bim-button></bim-panel-section><bim-panel-section label="Queries">\${queriesList}</bim-panel-section></bim-panel>\`;
      });
      document.body.appendChild(panel);

      const button = BUI.Component.create(() => BUI.html\`<bim-button class="phone-menu-toggler" icon="solar:settings-bold" @click="\${() => panel.classList.toggle('options-menu-visible')}"></bim-button>\`);
      document.body.appendChild(button);
      appendLog('UI panel created OK');
      Diagnostics.success('UI ready', 'UI');

      appendLog('Starting fragment models load...');
      Diagnostics.info('Loading fragment models...', 'LOAD');
      if (forceErrorMode === 'load') throw new Error('Forced load error');
      const paths = [
        'https://thatopen.github.io/engine_components/resources/frags/school_arq.frag',
        'https://thatopen.github.io/engine_components/resources/frags/school_str.frag'
      ];
      if (forceErrorMode === '1') { Diagnostics.warn('Force error: invalid URL', 'FORCE'); paths[0] = 'https://invalid.frag'; }

      await Promise.all(paths.map(async (p) => {
        const id = p.split('/').pop()?.split('.').shift();
        appendLog('Fetching model: ' + id + '...');
        Diagnostics.info('Loading: ' + id + '...', 'LOAD');

        appendLog('Starting fetch for ' + id + '...');
        const res = await fetch(p);
        if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + id);
        appendLog('Fetch OK for ' + id + ' - status: ' + res.status);

        appendLog('Getting ArrayBuffer for ' + id + '...');
        const buf = await res.arrayBuffer();
        appendLog('ArrayBuffer OK for ' + id + ' - size: ' + (buf.byteLength/1024/1024).toFixed(2) + 'MB');
        Diagnostics.success(id + ': ' + (buf.byteLength/1024/1024).toFixed(2) + 'MB', 'LOAD');

        appendLog('Loading ' + id + ' into fragments...');
        const result = await fragments.core.load(buf, { modelId: id });
        appendLog('Fragment load OK for ' + id);
        return result;
      }));

      appendLog('All models loaded successfully!');
      Diagnostics.success('All models loaded!', 'LOAD');
      document.getElementById('loadingOverlay').classList.add('hidden');
      Diagnostics.setSuccessState();

    } catch (err) {
      appendLog('CRITICAL ERROR: ' + err.message);
      Diagnostics.critical('Init failed: ' + err.message, 'FATAL');
      if (err.stack) Diagnostics.error('Stack:\n' + err.stack, 'FATAL');
      Diagnostics.showErrorOverlay('Initialization Error:\n\n' + err.message + '\n\n' + (err.stack || ''));
      document.querySelector('.loading-text').textContent = 'Error loading. Check diagnostics.';
      document.querySelector('.loading-spinner').style.borderColor = 'rgba(239, 68, 68, 0.3)';
      document.querySelector('.loading-spinner').style.borderTopColor = '#ef4444';
    }
  </script>
</body>
</html>
