<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItemsFinder Tutorial - ThatOpen Components</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }
    
    #container {
      height: 70vh;
      width: 100%;
      position: relative;
      background: #1a1a1a;
    }
    
    #debug-log {
      height: 30vh;
      width: 100%;
      background: #0d0d0d;
      color: #00ff41;
      font-family: 'Courier New', 'Monaco', monospace;
      font-size: 12px;
      overflow-y: auto;
      padding: 10px;
      border-top: 2px solid #333;
    }
    
    #debug-log::-webkit-scrollbar {
      width: 8px;
    }
    
    #debug-log::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    
    #debug-log::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }
    
    .log-entry {
      margin: 2px 0;
      line-height: 1.4;
    }
    
    .log-timestamp {
      color: #888;
    }
    
    .log-info { color: #00ff41; }
    .log-await { color: #ffd700; }
    .log-success { color: #00ff41; }
    .log-error { color: #ff4444; }
    
    /* UI Panel Styles */
    .options-menu {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 100;
      max-height: calc(70vh - 20px);
      overflow-y: auto;
    }
    
    .phone-menu-toggler {
      position: fixed;
      bottom: calc(30vh + 20px);
      right: 20px;
      z-index: 999;
      display: none;
    }
    
    /* Stats.js positioning */
    .stats-panel {
      position: absolute !important;
      top: 10px !important;
      left: 10px !important;
    }
    
    /* Mobile Styles */
    @media (max-width: 768px) {
      .options-menu {
        position: fixed;
        top: 0;
        right: -100%;
        width: 85%;
        max-width: 320px;
        height: 100%;
        max-height: 100vh;
        transition: right 0.3s ease-in-out;
        background: rgba(30, 30, 30, 0.98);
        z-index: 1000;
        padding: 10px;
        overflow-y: auto;
      }
      
      .options-menu-visible {
        right: 0;
      }
      
      .phone-menu-toggler {
        display: block;
      }
      
      #debug-log {
        font-size: 10px;
        padding: 6px;
      }
      
      #container {
        height: 65vh;
      }
      
      #debug-log {
        height: 35vh;
      }
      
      .phone-menu-toggler {
        bottom: calc(35vh + 15px);
      }
    }
    
    /* BIM UI Styles */
    bim-panel {
      background: rgba(30, 30, 30, 0.95);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    bim-button {
      cursor: pointer;
    }
  </style>
  
  <!-- Import Map with EXACT versions -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "stats.js": "https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.module.js",
      "@thatopen/fragments": "https://cdn.jsdelivr.net/npm/@thatopen/fragments@2.1.6/dist/index.mjs",
      "@thatopen/components": "https://cdn.jsdelivr.net/npm/@thatopen/components@2.4.4/dist/index.mjs",
      "@thatopen/ui": "https://cdn.jsdelivr.net/npm/@thatopen/ui@2.4.4/dist/index.js",
      "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.74/web-ifc-api.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"></div>
  <pre id="debug-log"></pre>

  <script type="module">
    // ============================================
    // VERBOSE LOGGING SYSTEM
    // ============================================
    const logElement = document.getElementById('debug-log');
    
    const appendLog = (message, type = 'info') => {
      const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
      const prefix = type === 'error' ? '❌' : 
                     type === 'success' ? '✅' : 
                     type === 'await' ? '⏳' : 'ℹ️';
      const className = `log-${type}`;
      
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="log-timestamp">[${timestamp}]</span> <span class="${className}">${prefix} ${message}</span>`;
      
      logElement.appendChild(entry);
      logElement.scrollTop = logElement.scrollHeight;
      
      // Also log to console for debugging
      console.log(`[${type.toUpperCase()}] ${message}`);
    };
    
    // Global error handlers
    window.addEventListener('error', (e) => {
      appendLog(`Global error: ${e.message} at ${e.filename}:${e.lineno}`, 'error');
    });
    
    window.addEventListener('unhandledrejection', (e) => {
      appendLog(`Unhandled promise: ${e.reason}`, 'error');
    });
    
    appendLog('========================================', 'info');
    appendLog('ItemsFinder Demo - Starting initialization', 'info');
    appendLog('========================================', 'info');

    // ============================================
    // MAIN APPLICATION
    // ============================================
    try {
      appendLog('Importing libraries...', 'await');
      
      // Import modules - FIX: Avoid OBC namespace collision by importing directly
      const [FRAGS, StatsModule, BUI, ComponentsModule] = await Promise.all([
        import("@thatopen/fragments"),
        import("stats.js"),
        import("@thatopen/ui"),
        import("@thatopen/components")
      ]);
      
      const Stats = StatsModule.default;
      const OBC = ComponentsModule;
      
      appendLog('✅ All libraries imported successfully', 'success');
      
      // ============================================
      // SETUP COMPONENTS
      // ============================================
      appendLog('Initializing ThatOpen Components...', 'await');
      const components = new OBC.Components();
      appendLog('✅ Components instance created', 'success');
      
      const worlds = components.get(OBC.Worlds);
      appendLog('✅ Worlds component obtained', 'success');
      
      const world = worlds.create();
      appendLog('✅ World created', 'success');
      
      // ============================================
      // SETUP SCENE
      // ============================================
      appendLog('Setting up scene...', 'await');
      world.scene = new OBC.SimpleScene(components);
      world.scene.setup();
      world.scene.three.background = null;
      appendLog('✅ Scene configured', 'success');
      
      // ============================================
      // SETUP RENDERER
      // ============================================
      appendLog('Setting up renderer...', 'await');
      const container = document.getElementById("container");
      world.renderer = new OBC.SimpleRenderer(components, container);
      appendLog('✅ Renderer initialized', 'success');
      
      // ============================================
      // SETUP CAMERA
      // ============================================
      appendLog('Setting up camera...', 'await');
      world.camera = new OBC.OrthoPerspectiveCamera(components);
      appendLog('✅ Camera created', 'success');
      
      // FIX: Ensure controls are fully initialized before setting lookAt
      appendLog('Configuring camera controls...', 'await');
      await new Promise(resolve => setTimeout(resolve, 100)); // Small delay for controls init
      await world.camera.controls.setLookAt(78, 20, -2.2, 26, -4, 25);
      appendLog('✅ Camera controls initialized', 'success');
      
      // ============================================
      // INITIALIZE COMPONENTS
      // ============================================
      appendLog('Initializing components...', 'await');
      components.init();
      appendLog('✅ Components initialized', 'success');
      
      // ============================================
      // SETUP FRAGMENTS MANAGER
      // ============================================
      appendLog('Setting up FragmentsManager...', 'await');
      const fragments = components.get(OBC.FragmentsManager);
      appendLog('✅ FragmentsManager obtained', 'success');
      
      // ============================================
      // FETCH WORKER (with fallback)
      // ============================================
      appendLog('Fetching worker.mjs from GitHub...', 'await');
      let workerUrl;
      try {
        const workerResponse = await fetch('https://thatopen.github.io/engine_fragment/resources/worker.mjs');
        if (!workerResponse.ok) throw new Error(`Worker fetch failed: ${workerResponse.status}`);
        
        const workerBlob = await workerResponse.blob();
        const workerFile = new File([workerBlob], "worker.mjs", { type: "text/javascript" });
        workerUrl = URL.createObjectURL(workerFile);
        
        // Store for potential offline use
        const workerText = await workerBlob.text();
        localStorage.setItem('thatopen-worker', workerText);
        
        appendLog('✅ Worker loaded and cached', 'success');
      } catch (workerError) {
        appendLog(`Worker fetch error: ${workerError.message}`, 'error');
        // Try localStorage fallback
        const cachedWorker = localStorage.getItem('thatopen-worker');
        if (cachedWorker) {
          const workerBlob = new Blob([cachedWorker], { type: "text/javascript" });
          workerUrl = URL.createObjectURL(workerBlob);
          appendLog('✅ Using cached worker from localStorage', 'success');
        } else {
          throw new Error('Worker unavailable - no cached version found');
        }
      }
      
      // Initialize fragments with worker
      appendLog('Initializing fragments with worker...', 'await');
      fragments.init(workerUrl);
      appendLog('✅ Fragments initialized', 'success');
      
      // ============================================
      // SETUP CONTROLS UPDATE
      // ============================================
      appendLog('Setting up controls update handler...', 'await');
      world.camera.controls.addEventListener("update", () => {
        fragments.core.update();
      });
      appendLog('✅ Controls update handler attached', 'success');
      
      // ============================================
      // SETUP CAMERA CHANGE HANDLER
      // ============================================
      world.onCameraChanged.add((camera) => {
        for (const [, model] of fragments.list) {
          model.useCamera(camera.three);
        }
        fragments.core.update(true);
      });
      
      // ============================================
      // SETUP FRAGMENT LOADING HANDLER
      // ============================================
      fragments.list.onItemSet.add(({ value: model }) => {
        model.useCamera(world.camera.three);
        world.scene.three.add(model.object);
        fragments.core.update(true);
        appendLog(`Model added to scene: ${model.modelId || 'unknown'}`, 'success');
      });
      
      // ============================================
      // Z-FIGHTING FIX
      // ============================================
      appendLog('Setting up z-fighting fix...', 'await');
      fragments.core.models.materials.list.onItemSet.add(({ value: material }) => {
        if (!("isLodMaterial" in material && material.isLodMaterial)) {
          material.polygonOffset = true;
          material.polygonOffsetUnits = 1;
          material.polygonOffsetFactor = Math.random();
        }
      });
      appendLog('✅ Z-fighting fix applied', 'success');
      
      // ============================================
      // LOAD FRAGMENT MODELS
      // ============================================
      const fragPaths = [
        "https://thatopen.github.io/engine_components/resources/frags/school_arq.frag",
        "https://thatopen.github.io/engine_components/resources/frags/school_str.frag",
      ];
      
      appendLog(`Loading ${fragPaths.length} fragment models...`, 'await');
      
      await Promise.all(
        fragPaths.map(async (path) => {
          const modelId = path.split("/").pop()?.split(".").shift();
          appendLog(`Fetching ${modelId}.frag...`, 'await');
          
          try {
            const file = await fetch(path);
            if (!file.ok) throw new Error(`HTTP ${file.status}`);
            
            const buffer = await file.arrayBuffer();
            const sizeMB = (buffer.byteLength / 1024 / 1024).toFixed(2);
            appendLog(`${modelId}.frag loaded (${sizeMB} MB)`, 'success');
            
            appendLog(`Processing ${modelId}...`, 'await');
            await fragments.core.load(buffer, { modelId });
            appendLog(`✅ ${modelId} added to scene`, 'success');
          } catch (error) {
            appendLog(`Error loading ${modelId}: ${error.message}`, 'error');
          }
        })
      );
      
      appendLog('✅ All models loaded', 'success');
      
      // ============================================
      // SETUP ITEMS FINDER
      // ============================================
      appendLog('Setting up ItemsFinder...', 'await');
      const finder = components.get(OBC.ItemsFinder);
      appendLog('✅ ItemsFinder obtained', 'success');
      
      // Query 1: Categories (Walls & Slabs)
      appendLog('Creating query: Walls & Slabs...', 'await');
      finder.create("Walls & Slabs", [{ categories: [/WALL/, /SLAB/] }]);
      appendLog('✅ Query created: Walls & Slabs', 'success');
      
      // Query 2: Attributes (Masonry Walls)
      appendLog('Creating query: Masonry Walls...', 'await');
      finder.create("Masonry Walls", [
        {
          categories: [/WALL/],
          attributes: { queries: [{ name: /Name/, value: /Masonry/ }] },
        },
      ]);
      appendLog('✅ Query created: Masonry Walls', 'success');
      
      // Query 3: Relations (First Level Columns)
      appendLog('Creating query: First Level Columns...', 'await');
      const entryLevel = {
        categories: [/BUILDINGSTOREY/],
        attributes: { queries: [{ name: /Name/, value: /Entry/ }] },
      };
      
      finder.create("First Level Columns", [
        {
          categories: [/COLUMN/],
          relation: { name: "ContainedInStructure", query: entryLevel },
        },
      ]);
      appendLog('✅ Query created: First Level Columns', 'success');
      
      // Helper function for query results
      const getResult = async (name) => {
        const finderQuery = finder.list.get(name);
        if (!finderQuery) return {};
        const result = await finderQuery.test();
        return result;
      };
      
      // ============================================
      // SETUP UI
      // ============================================
      appendLog('Initializing UI library...', 'await');
      BUI.Manager.init();
      appendLog('✅ UI library initialized', 'success');
      
      // Create queries table
      const queriesListTemplate = () => {
        const onCreated = (e) => {
          if (!e) return;
          const table = e;
          
          table.loadFunction = async () => {
            const data = [];
            for (const [name] of finder.list) {
              data.push({
                data: { Name: name, Actions: "" },
              });
            }
            return data;
          };
          
          table.loadData(true);
        };
        
        return BUI.html`
          <bim-table ${BUI.ref(onCreated)}></bim-table>
        `;
      };
      
      const queriesList = BUI.Component.create(queriesListTemplate);
      queriesList.style.maxHeight = "25rem";
      queriesList.columns = ["Name", { name: "Actions", width: "auto" }];
      queriesList.noIndentation = true;
      queriesList.headersHidden = true;
      queriesList.dataTransform = {
        Actions: (_, rowData) => {
          const { Name } = rowData;
          if (!Name) return _;
          
          const hider = components.get(OBC.Hider);
          const onClick = async ({ target }) => {
            target.loading = true;
            appendLog(`Running query: ${Name}...`, 'await');
            try {
              const modelIdMap = await getResult(Name);
              await hider.isolate(modelIdMap);
              appendLog(`✅ Query "${Name}" executed - items isolated`, 'success');
            } catch (error) {
              appendLog(`Query error: ${error.message}`, 'error');
            }
            target.loading = false;
          };
          
          return BUI.html`<bim-button icon="solar:cursor-bold" @click=${onClick}></bim-button>`;
        },
      };
      
      // Create main panel
      const panel = BUI.Component.create(() => {
        const onResetVisibility = async ({ target }) => {
          target.loading = true;
          appendLog('Resetting visibility...', 'await');
          try {
            const hider = components.get(OBC.Hider);
            await hider.set(true);
            appendLog('✅ Visibility reset - all items visible', 'success');
          } catch (error) {
            appendLog(`Reset error: ${error.message}`, 'error');
          }
          target.loading = false;
        };
        
        return BUI.html`
          <bim-panel active label="Items Finder Tutorial" class="options-menu">
            <bim-panel-section style="min-width: 14rem" label="General">
              <bim-button label="Reset Visibility" @click=${onResetVisibility}></bim-button>
            </bim-panel-section>
            <bim-panel-section label="Queries">
              ${queriesList}
            </bim-panel-section>
          </bim-panel>
        `;
      });
      
      document.body.append(panel);
      appendLog('✅ Main panel created', 'success');
      
      // Mobile menu toggle button
      const button = BUI.Component.create(() => {
        return BUI.html`
          <bim-button class="phone-menu-toggler" icon="solar:settings-bold"
            @click="${() => {
              if (panel.classList.contains("options-menu-visible")) {
                panel.classList.remove("options-menu-visible");
                appendLog('Menu hidden', 'info');
              } else {
                panel.classList.add("options-menu-visible");
                appendLog('Menu shown', 'info');
              }
            }}">
          </bim-button>
        `;
      });
      
      document.body.append(button);
      appendLog('✅ Mobile menu toggle created', 'success');
      
      // ============================================
      // STATS (Performance Monitor)
      // ============================================
      appendLog('Setting up performance monitor...', 'await');
      const stats = new Stats();
      stats.showPanel(2); // Memory panel
      stats.dom.className = 'stats-panel';
      document.body.append(stats.dom);
      
      world.renderer.onBeforeUpdate.add(() => stats.begin());
      world.renderer.onAfterUpdate.add(() => stats.end());
      appendLog('✅ Performance monitor active', 'success');
      
      // ============================================
      // INITIALIZATION COMPLETE
      // ============================================
      appendLog('========================================', 'success');
      appendLog('🎉 ItemsFinder Demo Ready!', 'success');
      appendLog('========================================', 'success');
      appendLog('Queries available:', 'info');
      appendLog('  • Walls & Slabs - Click to isolate', 'info');
      appendLog('  • Masonry Walls - Click to isolate', 'info');
      appendLog('  • First Level Columns - Click to isolate', 'info');
      appendLog('Use Reset Visibility to show all items', 'info');
      
    } catch (error) {
      appendLog(`FATAL ERROR: ${error.message}`, 'error');
      console.error('Full error:', error);
    }
  </script>
</body>
</html>
