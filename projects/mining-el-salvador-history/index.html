        function renderSummary() {
            document.getElementById('summary-brief').textContent = data.summary.brief;
            const kt = data.summary.keyTakeaways;
            const ul = document.getElementById('key-takeaways');
            ul.innerHTML = kt.map(p => `<li class="list-group-item">${p}</li>`).join('');
        }

        function renderVisualizations() {
            const vizContainer = document.getElementById('visualizations');
            data.visualizations.forEach((viz, index) => {
                const col = document.createElement('div');
                col.className = 'col-lg-6 col-md-12 mb-4';
                col.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">${viz.title}</h5>
                        </div>
                        <div class="card-body">
                            <p class="text-muted small">${viz.description}</p>
                            <div class="chart-container">
                                <canvas id="chart-${index}"></canvas>
                            </div>
                        </div>
                    </div>
                `;
                vizContainer.appendChild(col);
                new Chart(document.getElementById(`chart-${index}`), {
                    type: viz.type,
                    data: viz.data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        ...viz.options
                    }
                });
            });

            // Pollution viz
            const pollutionData = {
                labels: ['Surface Water Polluted (San Sebastian)', 'Deforestation since 1960s', 'Health Impacts (qualitative high)'],
                datasets: [{
                    label: 'Impact Level (%)',
                    data: [90, 85, 95],
                    backgroundColor: ['#dc3545', '#ffc107', '#fd7e14']
                }]
            };
            const pollutionCol = document.createElement('div');
            pollutionCol.className = 'col-lg-6 col-md-12 mb-4';
            pollutionCol.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Environmental Pollution Impacts</h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted small">Key metrics from historical records (estimates).</p>
                        <div class="chart-container">
                            <canvas id="pollution-chart"></canvas>
                        </div>
                    </div>
                </div>
            `;
            vizContainer.appendChild(pollutionCol);
            new Chart(document.getElementById('pollution-chart'), {
                type: 'bar',
                data: pollutionData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });
        }

        function renderSections() {
            const container = document.getElementById('sections-container');
            data.sections.sort((a, b) => a.order - b.order).forEach(section => {
                const accordionId = `accordion-${section.id.replace(/[^a-zA-Z0-9]/g, '')}`;
                const accordionItem = document.createElement('div');
                accordionItem.className = 'accordion mb-4';
                accordionItem.id = accordionId;
                accordionItem.innerHTML = `
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${section.id}">
                                ${section.title}
                            </button>
                        </h2>
                        <div id="collapse-${section.id}" class="accordion-collapse collapse" data-bs-parent="#${accordionId}">
                            <div class="accordion-body">
                                <div class="section-content"></div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(accordionItem);
                const body = accordionItem.querySelector('.section-content');
                section.content.forEach(item => {
                    if (item.type === 'paragraph') {
                        const p = document.createElement('p');
                        p.innerHTML = item.text.replace(/\[/g, '<sup>').replace(/\]/g, '</sup>');
                        body.appendChild(p);
                    } else if (item.type === 'key_points') {
                        const ul = document.createElement('ul');
                        ul.className = 'list-group list-group-flush mt-2';
                        item.points.forEach(pt => {
                            const li = document.createElement('li');
                            li.className = 'list-group-item';
                            li.textContent = pt.text;
                            ul.appendChild(li);
                        });
                        body.appendChild(ul);
                    } else if (item.type === 'data_table') {
                        const card = document.createElement('div');
                        card.className = 'card mt-3';
                        card.innerHTML = `
                            <div class="card-header">
                                <h6 class="mb-0">${item.title}</h6>
                            </div>
                            <div class="card-body p-0">
                                <table class="table table-striped table-sm mb-0">
                                    <thead>
                                        <tr>${item.headers.map(h => `<th>${h}</th>`).join('')}</tr>
                                    </thead>
                                    <tbody>
                                        ${item.rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                        body.appendChild(card);
                    }
                });
            });
        }

        function renderSources() {
            const container = document.getElementById('sources-container');
            let html = '<h2 class="mb-4">Sources</h2><div class="row">';
            Object.entries(data.sources).forEach(([key, src]) => {
                html += `
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <h6 class="card-title">${src.title}</h6>
                                <p class="card-text small text-muted">${src.type} | Credibility: ${src.credibility}</p>
                                ${src.author ? `<p class="small">${src.author}</p>` : ''}
                                <a href="${src.url}" class="btn btn-sm btn-outline-primary" target="_blank">View</a>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSummary();
            renderVisualizations();
            renderSections();
            renderSources();
        });
