<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Mobile optimization: prevent zoom/pinch conflicts, proper viewport - matches bim-viewer -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a1a">
  <title>Fragment Viewer + Properties</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- Build banner injected by Architect -->
<style>#build-banner{position:fixed;left:8px;top:8px;padding:6px 10px;background:rgba(0,0,0,0.6);color:#fff;font-family:monospace;border-radius:6px;z-index:9999;font-size:12px}</style>
<div id="build-banner">build: 6b7216c</div>

  <div class="app-container">
    <!-- Viewer Container - matches bim-viewer container pattern -->
    <div id="viewer-container" class="viewer-container">
      <div id="loading-indicator" class="loading-indicator">
        <div class="spinner"></div>
        <span>Loading fragment models...</span>
      </div>
    </div>
    <div class="properties-container">
      <div class="properties-header">
        <h2>Properties</h2>
        <span id="selection-info" class="selection-info">Click an element to view properties</span>
      </div>
      <div id="properties-table-container" class="properties-table-container">
        <table id="properties-table" class="properties-table">
          <thead>
            <tr>
              <th>Property</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody id="properties-tbody">
            <!-- Properties will be populated here -->
          </tbody>
        </table>
        <div id="empty-state" class="empty-state">
          <p>No element selected</p>
          <p class="hint">Click on any element in the 3D view to see its properties</p>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
